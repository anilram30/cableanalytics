[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cableanalytics"
version = "0.1.0"
description = "Loss, temperature and production analytics for high-frequency cables: three-term loss fits, derating, manufacturing-to-physics correlation, periodic-defect machine attribution and a predictive model."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sreeram Anil" }]
keywords = ["manufacturing-analytics", "predictive-modeling", "process-control", "regression", "cable-manufacturing", "materials", "scikit-learn", "signal-integrity", "python"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Manufacturing",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7", "pandas>=2.0", "scikit-learn>=1.3", "cablecheck>=0.1"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.8"]

[project.urls]
Homepage = "https://github.com/anilram30/cableanalytics"
Toolchain = "https://github.com/anilram30/hf-cable-toolchain"
Report = "https://github.com/anilram30/cableanalytics/blob/main/docs/report.pdf"
Issues = "https://github.com/anilram30/cableanalytics/issues"
Changelog = "https://github.com/anilram30/cableanalytics/blob/main/CHANGELOG.md"

[project.scripts]
cableanalytics = "cableanalytics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 160
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
# E702 and E731: this codebase deliberately groups short related statements on one line
# (plotting calls, tuple unpacking) and uses small lambdas for local helpers.
# E741: `l` reads naturally for an inductance or a length in transmission-line code.
ignore = ["E702", "E731", "E741"]
